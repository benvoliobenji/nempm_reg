name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # On PRs: schema + semantic checks for everything, plus version bumps and a
      # real download + SHA-256 + size check for every manifest the PR touches.
      - name: Validate changed manifests
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --base origin/${{ github.base_ref }}

      - name: Validate (offline)
        if: github.event_name == 'push'
        run: node scripts/validate.mjs
